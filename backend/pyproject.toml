[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nahriva-grid-analysis-backend"
version = "1.0.0"
description = "Nahriva Grid Analysis — PowerFactory planned-outage scenarios and simulation results"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.12,<1",
    "uvicorn[standard]>=0.30.6,<1",
    "pydantic>=2.11,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.3,<9", "httpx>=0.28.1,<1", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.analysis" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
